<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text area tag</title>
</head>
<body>
    <!-- learn textarea tag -->
    <form action="post">
        <label for="comment">leave your comment here ...</label><br>
        <textarea name="comment" id="comment" rows="5" cols="25" placeholder="write here..."></textarea>
    </form>
</body>
</html>
