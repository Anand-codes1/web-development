<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tag</title>
</head>
<body style="background-color: rgb(255, 172, 176);">
    <h1>Anchor tag</h1>
    <p>anchor tag (<a>) is used to create hyperlinks. It lets users navigate to another webpage, website, file, or a specific section of the same page.</p>
    <a target="_blank" href="https://www.google.com">open Google</a><br>
    <a target="_blank" href="https://www.youtube.com">open YouTube</a><br>
    <a target="_blank" href="https://www.facebook.com">open Facebook</a>
</body>
</html>
