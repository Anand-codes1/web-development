<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tags</title>
</head>
<link rel="stylesheet" href="table.css">
<body>
    <!-- learn table tags -->
    <table>
        <tr>
            <th>Name</th>
            <th>Stream</th>
            <th>Roll no.</th>
        </tr>
        <tr>
            <td>anand</td>
            <td>b.tech</td>
            <td>004</td>
        </tr>
        <tr>
            <td>shailendra</td>
            <td>b.tech</td>
            <td>034</td>
        </tr>
        <!-- row and column span usfing , " rowspan" and " colspan" -->
        <tr>
            <td rowspan="2">data1</td>
            <td colspan="2">data2</td>
        </tr>
        <tr>
            <td>data1</td>
            <td>data2</td>
        </tr>
    </table>
</body>

</html>
