<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline and block element</title>
</head>
<link rel="stylesheet" href="inline_block.css">
<body>
    <h1>What is inline and block element</h1>
    <h4>inline covers only needed space and does not start new line</h4>
    <h4>block covers full width and it starts new line</h4>
    <span>span is a inline element</span>
    <p>p "paragraph" is a block element and it covers full width and starts new line</p>
</body>
</html>
