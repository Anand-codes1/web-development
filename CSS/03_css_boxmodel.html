<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box model</title>
    <style>
        body {
            background-color: antiquewhite;
        }

        .box {
            border: 3px solid black;
        }

        .box1 {
            background-color: rgb(66, 216, 216);
            margin: 20px;
        }

        .box2 {
            background-color: rgb(194, 154, 231);
            margin: 20px;
            height: 50px;
        }
    </style>
</head>

<body>
    <h1>How box model work in css </h1>
    <P class="box box1">box 1 </P>
    <p class="box box2">box 2</p>
    <div
        style="background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); width: 100px; height: 100px; border-radius: 100px; border: 2px solid black; margin: 20px;">
    </div>
</body>

</html>
